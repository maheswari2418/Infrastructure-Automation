---
- name: Deploy 3-Tier Infrastructure
  hosts: localhost
  gather_facts: no
  
  pre_tasks:
    - name: Validate inventory
      assert:
        that:
          - groups.get('webservers', [])|length > 0
          - groups.get('appservers', [])|length > 0
        fail_msg: "Inventory must contain webservers and appservers groups"

- name: Configure Application Tier First
  import_playbook: playbooks/app.yml

- name: Configure Web Tier with Load Balancing
  import_playbook: playbooks/web.yml

- name: Verify Deployment
  hosts: all
  gather_facts: yes
  tasks:
    - name: Collect deployment info
      debug:
        msg: |
          Host: {{ inventory_hostname }}
          OS: {{ ansible_distribution }} {{ ansible_distribution_version }}
          IP: {{ ansible_default_ipv4.address }}
