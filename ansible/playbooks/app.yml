---
- name: Configure Application Tier (Node.js)
  hosts: appservers
  gather_facts: yes
  
  tasks:
    - name: Update system packages
      yum:
        name: "*"
        state: latest
      
    - name: Install application packages
      yum:
        name: "{{ app_packages }}"
        state: present
      
    - name: Create application directory
      file:
        path: "{{ app_dir }}"
        state: directory
        owner: "{{ app_user }}"
        group: "{{ app_group }}"
        mode: '0755'
      
    - name: Deploy Node.js application from template
      template:
        src: flask_app.py.j2
        dest: "{{ app_dir }}/app.js"
        owner: "{{ app_user }}"
        group: "{{ app_group }}"
        mode: '0755'
      
    - name: Create package.json
      copy:
        content: |
          {
            "name": "3tier-app",
            "version": "1.0.0",
            "description": "3-Tier Application - Node.js Backend",
            "main": "app.js",
            "scripts": {
              "start": "node app.js",
              "dev": "NODE_ENV=development node app.js"
            },
            "dependencies": {
              "express": "^4.18.2",
              "mysql2": "^3.6.0",
              "body-parser": "^1.20.2",
              "cors": "^2.8.5"
            },
            "engines": {
              "node": ">=14.0.0"
            }
          }
        dest: "{{ app_dir }}/package.json"
        owner: "{{ app_user }}"
        group: "{{ app_group }}"
        mode: '0644'
      
    - name: Install Node.js dependencies
      npm:
        path: "{{ app_dir }}"
        state: present
      
    - name: Create systemd service from template
      template:
        src: flask.service.j2
        dest: /etc/systemd/system/node-app.service
        owner: root
        group: root
        mode: '0644'
      notify: reload systemd
      
    - name: Enable and start Node.js application
      systemd:
        name: node-app
        state: started
        enabled: yes
        daemon_reload: yes
      
    - name: Configure firewall for application port
      firewalld:
        port: "{{ app_port }}/tcp"
        permanent: yes
        state: enabled
        immediate: yes
      ignore_errors: yes
      
    - name: Create application health check script
      copy:
        content: |
          #!/bin/bash
          curl -s http://localhost:{{ app_port }}/health | grep -q ok
          if [ $? -eq 0 ]; then
            echo "Application is healthy"
            exit 0
          else
            echo "Application is unhealthy"
            exit 1
          fi
        dest: /usr/local/bin/app-health-check
        owner: root
        group: root
        mode: '0755'
      
    - name: Test Node.js application connectivity
      uri:
        url: "http://localhost:{{ app_port }}/health"
        method: GET
        status_code: 200
      retries: 5
      delay: 2
      register: app_health_check
      
    - name: Display application info
      debug:
        msg: "Node.js application is running on {{ ansible_hostname }}:{{ app_port }}"
      when: app_health_check.status == 200
      
  handlers:
    - name: reload systemd
      systemd:
        daemon_reload: yes
