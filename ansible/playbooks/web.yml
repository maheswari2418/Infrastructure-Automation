---
- name: Configure Web Tier
  hosts: webservers
  gather_facts: yes
  
  tasks:
    - name: Update system packages
      yum:
        name: "*"
        state: latest
      
    - name: Install web server packages
      yum:
        name: "{{ web_packages }}"
        state: present
      
    - name: Install mod_proxy for load balancing
      yum:
        name: 
          - mod_proxy
          - mod_proxy_balancer
          - mod_proxy_http
        state: present
      
    - name: Create Apache proxy configuration
      template:
        src: httpd.conf.j2
        dest: /etc/httpd/conf.d/proxy.conf
        owner: root
        group: root
        mode: '0644'
      notify: restart httpd
      
    - name: Enable Apache modules
      lineinfile:
        path: /etc/httpd/conf/httpd.conf
        line: "LoadModule {{ item }}"
        state: present
      loop:
        - "proxy_module modules/mod_proxy.so"
        - "proxy_balancer_module modules/mod_proxy_balancer.so"
        - "proxy_http_module modules/mod_proxy_http.so"
      notify: restart httpd
      
    - name: Ensure Apache httpd is started and enabled
      systemd:
        name: "{{ web_service_name }}"
        state: started
        enabled: yes
        daemon_reload: yes
      
    - name: Configure firewall for HTTP
      firewalld:
        port: "{{ item }}/tcp"
        permanent: yes
        state: enabled
        immediate: yes
      loop:
        - "{{ web_port }}"
        - "{{ ssl_port }}"
      ignore_errors: yes
      
    - name: Create health check page
      copy:
        content: |
          <!DOCTYPE html>
          <html>
          <head><title>Web Server</title></head>
          <body>
          <h1>Web Tier - Healthy</h1>
          <p>Hostname: {{ ansible_hostname }}</p>
          <p>IP Address: {{ ansible_default_ipv4.address }}</p>
          </body>
          </html>
        dest: /var/www/html/index.html
        owner: root
        group: root
        mode: '0644'
      
  handlers:
    - name: restart httpd
      systemd:
        name: httpd
        state: restarted
