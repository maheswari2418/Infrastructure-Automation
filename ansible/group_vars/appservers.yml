---
# Application Tier Configuration (Node.js)
app_packages:
  - nodejs
  - npm
  - git
  - curl
  - wget
  - mysql

node_packages:
  - express
  - mysql2
  - body-parser
  - cors

app_port: 8080
app_user: root
app_group: root
app_dir: /opt/app

# Database configuration
database:
  host: "{{ hostvars['localhost']['rds_endpoint'] }}"
  port: 3306
  user: admin
  name: appdb

# Monitoring and logging
enable_logging: true
log_level: info
